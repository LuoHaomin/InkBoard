[project]
name = "inkboard"
version = "0.2.0"
description = "墨板 InkBoard — 把电纸书当电脑手写板/数位板"
readme = "README.md"
authors = [
    { name = "LuoHaomin", email = "luohaomin@mail.ustc.edu.cn" }
]
requires-python = ">=3.13"
dependencies = [
    "pygame>=2.6.1",
    "pyobjc-framework-quartz>=12.2.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]
